<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sarkari Darpan Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#1e293b;font-family:Arial,sans-serif}header{background:#142b4a;color:white;padding:18px}main{max-width:850px;margin:24px auto;padding:0 14px}.card{background:white;border:1px solid #e2e8f0;border-radius:13px;padding:18px;margin-bottom:16px}h2{color:#142b4a;margin-top:0}label{display:block;font-weight:bold;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:75px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:8px;padding:11px 15px;background:#c8323e;color:white;font-weight:bold;margin:10px 6px 0 0;cursor:pointer}.secondary{background:#e8edf4;color:#142b4a}.danger{background:#9f2630}.muted{color:#64748b;font-size:13px}.hidden{display:none}.msg{background:#eff6ff;padding:10px;border-radius:8px;margin-top:10px}.post{border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin:9px 0}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body><header><b>SARKARI DARPAN — ADMIN</b><div class="muted" style="color:#d8e3f1">Private content management panel</div></header><main>
<section id="login" class="card"><h2>Admin Login</h2><label>Username</label><input id="username" autocomplete="username" placeholder="admin"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Login</button><div id="loginMsg" class="msg hidden"></div><p class="muted">कोई public sign-up नहीं है। Admin account Firebase Console में manually बनाना होगा।</p></section>
<section id="dash" class="hidden"><div class="card"><button id="logout" class="secondary" style="float:right">Logout</button><h2>Admin Dashboard</h2><p class="muted">यहाँ से Job, Result, Admit Card और Answer Key publish करें।</p></div>
<div class="card"><h2 id="formTitle">नई पोस्ट जोड़ें</h2><input id="docId" type="hidden"><div class="row"><div><label>Post Type</label><select id="category"><option value="job">Latest Job</option><option value="result">Result</option><option value="admit">Admit Card</option><option value="answer">Answer Key</option><option value="admission">Admission</option></select></div><div><label>Status</label><select id="published"><option value="true">Publish</option><option value="false">Draft</option></select></div></div>
<div class="row"><div><label>शीर्षक (हिंदी)</label><input id="titleHi"></div><div><label>Title (English)</label><input id="titleEn"></div></div><div class="row"><div><label>विवरण (हिंदी)</label><textarea id="descHi"></textarea></div><div><label>Description (English)</label><textarea id="descEn"></textarea></div></div><label>Official / Apply URL (https://)</label><input id="url" type="url" placeholder="https://..."><button id="save">पोस्ट सेव करें</button><button id="clear" class="secondary">Cancel</button><div id="formMsg" class="msg hidden"></div></div>
<div class="card"><h2>आपकी पोस्ट</h2><div id="posts" class="muted">लोड हो रहा है...</div></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script>
<script>
const $=id=>document.getElementById(id),USERNAME="admin",AUTH_EMAIL="admin@sarkaridarpan.test";let auth,db;
function message(id,t){$(id).textContent=t;$(id).classList.remove("hidden")}
function clearForm(){["docId","titleHi","titleEn","descHi","descEn","url"].forEach(id=>$(id).value="");$("category").value="job";$("published").value="true";$("formTitle").textContent="नई पोस्ट जोड़ें"}
if(firebaseConfig.apiKey!=="PASTE_API_KEY"){firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(u=>{ $("login").classList.toggle("hidden",!!u);$("dash").classList.toggle("hidden",!u);if(u)loadPosts()})}else{message("loginMsg","पहले firebase-config.js में Firebase Web App config भरें।")}
$("loginBtn").onclick=async()=>{if($("username").value.trim().toLowerCase()!==USERNAME){message("loginMsg","Username या Password गलत है।");return}try{await auth.signInWithEmailAndPassword(AUTH_EMAIL,$("password").value)}catch(e){message("loginMsg","Login असफल। Firebase setup और password जाँचें।")}};
$("logout").onclick=()=>auth.signOut();$("clear").onclick=clearForm;
$("save").onclick=async()=>{let url=$("url").value.trim();if(!$("titleHi").value.trim()&&!$("titleEn").value.trim()){message("formMsg","कम-से-कम एक शीर्षक लिखें।");return}if(url&&!/^https:\/\//i.test(url)){message("formMsg","लिंक https:// से शुरू होना चाहिए।");return}
let d={category:$("category").value,titleHi:$("titleHi").value.trim(),titleEn:$("titleEn").value.trim(),descHi:$("descHi").value.trim(),descEn:$("descEn").value.trim(),url,published:$("published").value==="true",updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
try{if($("docId").value)await db.collection("posts").doc($("docId").value).update(d);else{d.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection("posts").add(d)}message("formMsg","पोस्ट सेव हो गई।");clearForm();loadPosts()}catch(e){message("formMsg","सेव नहीं हुआ। Firestore Rules जाँचें।")}};
async function loadPosts(){let box=$("posts");box.textContent="लोड हो रहा है...";try{let s=await db.collection("posts").orderBy("createdAt","desc").get();box.innerHTML="";if(s.empty){box.textContent="अभी कोई पोस्ट नहीं है।";return}s.forEach(doc=>{let d=doc.data(),el=document.createElement("div");el.className="post";let b=document.createElement("b");b.textContent=d.titleHi||d.titleEn||"Untitled";let p=document.createElement("p");p.className="muted";p.textContent=d.category+" • "+(d.published?"Published":"Draft");let e=document.createElement("button");e.className="secondary";e.textContent="Edit";e.onclick=()=>{ $("docId").value=doc.id;["category","titleHi","titleEn","descHi","descEn","url"].forEach(k=>$(k).value=d[k]||"");$("published").value=String(!!d.published);$("formTitle").textContent="पोस्ट Edit करें";scrollTo(0,0)};let x=document.createElement("button");x.className="danger";x.textContent="Delete";x.onclick=async()=>{if(confirm("यह पोस्ट delete करें?")){await db.collection("posts").doc(doc.id).delete();loadPosts()}};el.append(b,p,e,x);box.append(el)})}catch(e){box.textContent="Load error: Firestore Rules / config जाँचें।"}}
</script></body></html>
